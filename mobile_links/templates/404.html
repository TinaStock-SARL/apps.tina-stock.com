<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            position: relative;
        }
        
        .container {
            text-align: center;
            padding: 20px;
        }
        
        .message {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .arrow-container {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }
        
        .arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #007bff;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .click-text {
            position: absolute;
            top: 35px;
            right: -10px;
            font-size: 12px;
            color: #007bff;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">Veuillez cliquer ici !</div>
    </div>
    
    <div class="arrow-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="arrow"></div>
        <div class="click-text">Cliquez</div>
    </div>
</body>
</html>
