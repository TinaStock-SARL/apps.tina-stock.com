<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            position: relative;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }
        
        .download-blocks {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        
        .download-block {
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s ease;
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .download-block.disabled {
            background-color: #f8f9fa;
            border-color: #ccc;
        }
        
        .download-icon {
            font-size: 48px;
        }
        
        .download-content {
            text-align: left;
        }
        
        .download-title {
            font-size: 20px;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        
        .download-subtitle {
            font-size: 14px;
            color: #999;
        }
        
        .unavailable-badge {
            display: inline-block;
            background-color: #ffc107;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .arrow-container {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }
        
        .arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #007bff;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .click-text {
            position: absolute;
            top: 35px;
            right: -10px;
            font-size: 12px;
            color: #007bff;
            white-space: nowrap;
        }
        
        @media (max-width: 600px) {
            .download-block {
                flex-direction: column;
                text-align: center;
            }
            
            .download-content {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="download-blocks">
            <div class="download-block disabled">
                <div class="download-icon">🤖</div>
                <div class="download-content">
                    <div class="download-title">
                        Télécharger sur Android
                        <span class="unavailable-badge">Non disponible</span>
                    </div>
                    <div class="download-subtitle">L'application n'est pas encore disponible</div>
                </div>
            </div>
            
            <div class="download-block disabled">
                <div class="download-icon">🍎</div>
                <div class="download-content">
                    <div class="download-title">
                        Télécharger sur iOS
                        <span class="unavailable-badge">Non disponible</span>
                    </div>
                    <div class="download-subtitle">L'application n'est pas encore disponible</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="arrow-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="arrow"></div>
        <div class="click-text">Cliquez</div>
    </div>
</body>
</html>
