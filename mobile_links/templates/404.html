<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            position: relative;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }
        
        .download-blocks {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        
        .download-block {
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s ease;
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .download-block.disabled {
            background-color: #f8f9fa;
            border-color: #ccc;
        }
        
        .download-icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
        }
        
        .download-icon svg {
            width: 100%;
            height: 100%;
        }
        
        .download-content {
            text-align: left;
        }
        
        .download-title {
            font-size: 20px;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        
        .download-subtitle {
            font-size: 14px;
            color: #999;
        }
        
        .unavailable-badge {
            display: inline-block;
            background-color: #ffc107;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .arrow-container {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }
        
        .arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #007bff;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        
        @media (max-width: 600px) {
            .download-block {
                flex-direction: column;
                text-align: center;
            }
            
            .download-content {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="download-blocks">
            <div class="download-block disabled">
                <div class="download-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5509 0 .9993.4482.9993.9993.0001.5511-.4484.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5509 0 .9993.4482.9993.9993 0 .5511-.4484.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.2439 13.8533 7.8508 12 7.8508s-3.5902.3931-5.1349 1.0987L4.8429 5.4467a.4161.4161 0 00-.5676-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.186.8532 13.3077.8532 15.7404v.7225c0 .414.336.75.75.75h20.7936c.414 0 .75-.336.75-.75v-.7225c0-2.4327-1.8357-4.5537-4.2667-5.419z" fill="#3DDC84"/>
                    </svg>
                </div>
                <div class="download-content">
                    <div class="download-title">
                        Télécharger sur Android
                        <span class="unavailable-badge">Non disponible</span>
                    </div>
                    <div class="download-subtitle">L'application n'est pas encore disponible</div>
                </div>
            </div>
            
            <div class="download-block disabled">
                <div class="download-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.05 20.28c-.98.95-2.278 1.47-3.55 1.47-1.273 0-2.57-.52-3.55-1.47-1.96-1.9-1.96-4.99 0-6.89L12 11.23l1.95 2.16c1.96 1.9 1.96 4.99 0 6.89zm-1.4-5.86l-1.6-1.77-1.6 1.77c-.74.72-.74 1.88 0 2.6.74.72 1.94.72 2.68 0 .36-.35.56-.82.56-1.3s-.2-.95-.56-1.3h.52zm6.35-13.6c1.11 0 2.01.9 2.01 2.01v15.14c0 1.11-.9 2.01-2.01 2.01H2c-1.11 0-2.01-.9-2.01-2.01V3.43c0-1.11.9-2.01 2.01-2.01h20zm0-2H2C.9 1 0 1.9 0 3.43v15.14C0 20.1.9 21 2 21h20c1.1 0 2-.9 2-2.43V3.43C24 1.9 23.1 1 22 1z" fill="#000000"/>
                    </svg>
                </div>
                <div class="download-content">
                    <div class="download-title">
                        Télécharger sur iOS
                        <span class="unavailable-badge">Non disponible</span>
                    </div>
                    <div class="download-subtitle">L'application n'est pas encore disponible</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="arrow-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="arrow"></div>
    </div>
</body>
</html>
