{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - TinaStock</title>
    <!-- Open Graph / WhatsApp Meta Tags -->
    {% if product %}
        <!-- Open Graph / WhatsApp -->
        <meta property="og:title" content="{{ product.name }} - {{ product.price }} GNF | TinaStock">
        <meta property="og:description" content="{{ product.description|truncatechars:180 }}">
        <meta property="og:image" content="{{ product.image }}?v=2">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:url" content="{{ product.og_url }}">
        <meta property="og:type" content="product">
        <meta property="og:site_name" content="TinaStock">

        <!-- Bonus pour grosse image -->
        <meta name="twitter:card" content="summary_large_image">
    {% else %}
        <meta property="og:title" content="TinaStock">
        <meta property="og:description" content="Plateforme de gestion et vente de produits">
    {% endif %}
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .animate-bounce-custom {
            animation: bounce 2s infinite;
        }
        @keyframes arrow-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .arrow-float {
            animation: arrow-float 1.2s ease-in-out infinite;
        }
        .arrow-hint {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .arrow-hint.visible {
            opacity: 1;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100 relative">
    <!-- Flèche "Cliquer ici" en haut à droite (apparaît après 2s) -->
    <div id="arrow-hint" class="arrow-hint fixed top-4 right-4 z-50 flex flex-col items-center gap-1 text-gray-600 bg-white/90 backdrop-blur-sm rounded-lg shadow-lg px-4 py-3 border border-gray-200">
        <i class="fas fa-arrow-up arrow-float text-xl text-gray-500"></i>
        <span class="text-xs font-semibold whitespace-nowrap">Cliquer ici !</span>
    </div>
    <div class="text-center p-5 max-w-2xl w-full">
        <div class="flex flex-col gap-5 mt-8">
            <!-- Bloc Android -->
            <a href="https://play.google.com/store/apps/details?id=gn.kinnovate.tinastock_client" target="_blank" class="bg-gray-50 border-2 border-gray-300 rounded-xl p-8 flex items-center justify-center gap-4 transition-all duration-300 flex-col md:flex-row hover:border-green-500 hover:shadow-lg hover:scale-105">
                <div class="flex-shrink-0">
                    <i class="fab fa-android text-6xl text-green-500"></i>
                </div>
                <div class="text-left md:text-left text-center">
                    <div class="text-xl font-bold text-gray-600 mb-1">
                        Télécharger sur Android
                        <span class="inline-block bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold ml-2">
                            Disponible
                        </span>
                    </div>
                    <div class="text-sm text-gray-500">
                        Cliquez pour télécharger l'APK
                    </div>
                </div>
            </a>
            
            <!-- Bloc iOS -->
            <a href="https://apps.apple.com/us/app/tinastock/id6757655762" target="_blank" rel="noopener noreferrer" class="bg-white border-2 border-gray-300 rounded-xl p-8 flex items-center justify-center gap-4 cursor-pointer transition-all duration-300 flex-col md:flex-row hover:border-blue-500 hover:shadow-lg hover:scale-105">
                <div class="flex-shrink-0">
                    <i class="fab fa-apple text-6xl text-gray-900"></i>
                </div>
                <div class="text-left md:text-left text-center">
                    <div class="text-xl font-bold text-gray-800 mb-1">
                        Télécharger sur iOS
                        <span class="inline-block bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold ml-2">
                            Disponible
                        </span>
                    </div>
                    <div class="text-sm text-gray-600">
                        Disponible sur l'App Store
                    </div>
                </div>
            </a>
        </div>
    </div>
    <script>
        (function() {
            var hint = document.getElementById('arrow-hint');
            if (hint) {
                setTimeout(function() {
                    hint.classList.add('visible');
                }, 1000);
            }
        })();
    </script>
</body>
</html>
